name: Claude CI — GHL Phone Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        env:
          # OpenRouter base URL — note the required /v1 suffix
          ANTHROPIC_BASE_URL: https://openrouter.ai/api/v1
        with:
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          mcp_config: |
            {
              "mcpServers": {
                "ghl-phone": {
                  "type": "http",
                  "url": "${{ secrets.GHL_MCP_URL }}",
                  "headers": {
                    "Authorization": "Bearer ${{ secrets.GHL_MCP_SECRET }}"
                  }
                }
              }
            }
          prompt: |
            You have access to the ghl-phone MCP server which connects to GoHighLevel.
            Review this pull request for:
            1. Linting issues — unused variables, bad formatting, style violations
            2. Failing or missing tests — flag logic that lacks test coverage
            3. Security issues — hardcoded secrets, unsafe inputs, injection risks
            4. Breaking changes — anything likely to break existing functionality
            Post inline comments on specific lines where issues are found.
            Be concise and actionable. Skip minor stylistic preferences.
